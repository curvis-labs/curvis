name: Installers

# Builds unsigned installers for Windows, macOS and Linux and checks that each one
# starts the app (1.0 is not signed, by the project owner's decision). The Windows
# installer and the .deb are installed over the v1.0.0 release, as the updater does, to
# check that they upgrade in place and keep the settings; on macOS the updater's script
# replaces a Curvis.app. The installers
# are uploaded as artifacts.

# Run as part of CI (ci.yml calls it, and its concurrency setting covers these jobs),
# or on its own from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

env:
  # Quit as soon as the launcher has been shown (see curvis.app).
  CURVIS_EXIT_AFTER_LAUNCHER: "1"
  QT_QPA_PLATFORM: offscreen
  APPIMAGETOOL_VERSION: "1.9.0"
  APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
  # The new installers must upgrade this release in place (no uninstall first).
  PREVIOUS_RELEASE: "https://github.com/curvis-labs/curvis/releases/download/v1.0.0"
  PREVIOUS_SETUP_SHA256: 0d0b61438f7adf076c98c327918d10bafa8542555ef1c9a697ab77c81c7e52f8
  PREVIOUS_DEB_SHA256: ed54eede40078c4b7f9772792b88c6ab2f98a8611b30f972e8ee535c89e79394

jobs:
  linux:
    name: Linux (.deb, AppImage)
    # The oldest supported runner, so the bundle runs on older glibc versions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"  # no FUSE on runners
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            desktop-file-utils  # appimagetool validates the .desktop file

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev --group build

      - name: Read version
        run: echo "VERSION=$(uv run --no-sync python -c 'import curvis; print(curvis.__version__)')" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: uv run --no-sync pyinstaller packaging/curvis.spec --noconfirm

      # The analyses and some libraries are imported by name or inside functions; a
      # missing one only fails when used, which the smoke test below would not see.
      - name: Check the bundle has every analysis and library
        run: uv run --no-sync python packaging/check_bundle.py

      - name: Build .deb
        run: packaging/linux/build-deb.sh "$VERSION"

      - name: Build AppImage
        run: |
          curl -sSfL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum --check
          chmod +x appimagetool
          packaging/linux/build-appimage.sh "$VERSION" "$PWD/appimagetool"

      - name: Install the previous release's .deb
        run: |
          curl -sSfL -o /tmp/previous.deb "$PREVIOUS_RELEASE/curvis_1.0.0_amd64.deb"
          echo "${PREVIOUS_DEB_SHA256}  /tmp/previous.deb" | sha256sum --check
          sudo apt-get install -y /tmp/previous.deb
          sudo touch /opt/curvis/_internal/left-by-the-old-version

      # Installs over the previous release, as the updater does (pkexec apt-get install).
      - name: Smoke test the .deb (upgrading the previous release)
        run: |
          sudo apt-get install -y ./dist/curvis_*.deb
          test "$(dpkg-query -W -f='${Status}' curvis)" = "install ok installed"
          dpkg-query -W -f='${Version}\n' curvis
          test ! -e /opt/curvis/_internal/left-by-the-old-version
          time curvis
          grep -q 'application/x-curvis-project:\*.cvp' /usr/share/mime/globs2
          test -f /usr/share/icons/hicolor/scalable/apps/org.curvis.Curvis.svg
          test -f /usr/share/icons/hicolor/256x256/apps/org.curvis.Curvis.png

      - name: Smoke test the AppImage
        run: time ./dist/Curvis-*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: curvis-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev --group build

      - name: Read version
        run: echo "VERSION=$(uv run --no-sync python -c 'import curvis; print(curvis.__version__)')" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: uv run --no-sync pyinstaller packaging/curvis.spec --noconfirm

      # The analyses and some libraries are imported by name or inside functions; a
      # missing one only fails when used, which the smoke test below would not see.
      - name: Check the bundle has every analysis and library
        run: uv run --no-sync python packaging/check_bundle.py

      - name: Check the bundle id, icon and .cvp file type
        run: |
          plist=dist/Curvis.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" | grep -qx org.curvis.Curvis
          icon="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$plist")"
          sips -g pixelWidth "dist/Curvis.app/Contents/Resources/$icon"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:LSItemContentTypes:0" "$plist"
          /usr/libexec/PlistBuddy -c "Print :UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0" "$plist" | grep -qx cvp

      - name: Build .dmg
        run: |
          dmg="dist/Curvis-${VERSION}-macos-$(uname -m).dmg"
          hdiutil create -volname Curvis -srcfolder dist/Curvis.app -ov -format UDZO "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      # The updater's script (curvis.update.install.MAC_SCRIPT) replaces an installed
      # Curvis.app with the one in the new .dmg.
      - name: Replace an older Curvis.app with the updater's script
        run: |
          apps="$(mktemp -d)"
          mkdir -p "$apps/Curvis.app/Contents"
          touch "$apps/Curvis.app/Contents/left-by-the-old-version"
          uv run --no-sync python -c "from curvis.update.install import MAC_SCRIPT; print(MAC_SCRIPT, end='')" > "$apps/update.sh"
          cp "$DMG" "$apps/update.dmg"
          # A finished process stands in for Curvis; `open` is not wanted on the runner.
          sed -i '' 's/^open "\$app"$/echo "would open $app"/' "$apps/update.sh"
          bash "$apps/update.sh" 999999 "$apps/update.dmg" "$apps/Curvis.app"
          test -x "$apps/Curvis.app/Contents/MacOS/Curvis"
          test ! -e "$apps/Curvis.app/Contents/left-by-the-old-version"
          test ! -e "$apps/update.dmg"
          ls "$apps"

      - name: Smoke test the .dmg
        run: |
          hdiutil attach "$DMG" -mountpoint /Volumes/Curvis -nobrowse
          time /Volumes/Curvis/Curvis.app/Contents/MacOS/Curvis
          hdiutil detach /Volumes/Curvis

      - uses: actions/upload-artifact@v7
        with:
          name: curvis-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (installer .exe)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev --group build

      - name: Read version
        run: |
          $v = uv run --no-sync python -c "import curvis; print(curvis.__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build app bundle
        run: uv run --no-sync pyinstaller packaging/curvis.spec --noconfirm

      # The analyses and some libraries are imported by name or inside functions; a
      # missing one only fails when used, which the smoke test below would not see.
      - name: Check the bundle has every analysis and library
        run: uv run --no-sync python packaging/check_bundle.py

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $numeric = [regex]::Match($env:VERSION, '^\d+(\.\d+)*').Value
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$numeric" packaging\windows\curvis.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the previous release
        run: |
          $previous = "$env:RUNNER_TEMP\previous-setup.exe"
          Invoke-WebRequest "$env:PREVIOUS_RELEASE/Curvis-1.0.0-setup.exe" -OutFile $previous
          $hash = (Get-FileHash $previous -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:PREVIOUS_SETUP_SHA256) { throw "checksum mismatch: $hash" }
          $p = Start-Process $previous -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "previous installer exited with $($p.ExitCode)" }
          # A setting (QSettings: HKCU\Software\Curvis\Curvis) and a file only the old
          # version has: the upgrade keeps the first and removes the second.
          New-Item -Path 'HKCU:\Software\Curvis\Curvis\projects' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Curvis\Curvis\projects' -Name 'autosave_minutes' -Value '7'
          New-Item "$env:LOCALAPPDATA\Programs\Curvis\_internal\left-by-the-old-version" -ItemType File -Force | Out-Null

      # Installs over the previous release with the arguments the updater uses
      # (curvis.update.install.WINDOWS_ARGUMENTS, without /RELAUNCH).
      - name: Smoke test the installer (upgrading the previous release)
        run: |
          $setup = "dist\Curvis-$env:VERSION-setup.exe"
          $p = Start-Process $setup -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Curvis\Curvis.exe"
          if (-not (Test-Path $exe)) { throw "Curvis.exe was not installed at $exe" }
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B3C2A0E-8E7D-4B6A-9C1F-3D5E7A9B2C41}_is1'
          $entry = Get-ItemProperty $uninstall
          if ($entry.DisplayVersion -ne $env:VERSION) { throw "installed version is $($entry.DisplayVersion)" }
          $all = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like 'Curvis*' }
          if (@($all).Count -ne 1) { throw "expected one Curvis in Apps, found $(@($all).Count)" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Curvis\_internal\left-by-the-old-version") { throw "the old version's files were left" }
          $kept = (Get-ItemProperty 'HKCU:\Software\Curvis\Curvis\projects').autosave_minutes
          if ($kept -ne '7') { throw "the settings were not kept ($kept)" }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process $exe -Wait -PassThru
          "Started and quit in $($clock.Elapsed.TotalSeconds) s"
          if ($app.ExitCode -ne 0) { throw "Curvis exited with $($app.ExitCode)" }
          $assoc = (Get-ItemProperty 'HKCU:\Software\Classes\.cvp').'(default)'
          if ($assoc -ne 'Curvis.Project') { throw ".cvp is not associated with Curvis ($assoc)" }

      - uses: actions/upload-artifact@v7
        with:
          name: curvis-windows
          path: dist/*-setup.exe
          if-no-files-found: error
