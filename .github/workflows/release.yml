name: Release

# Pushing a tag such as v1.0.0 builds the installers for Windows, macOS and Linux (installers.yml: each one is installed and started on its runner), writes the
# validation report, and publishes them all as a GitHub release whose notes are the
# version's section of CHANGELOG.md. A tag with a hyphen (v1.0.0-rc1) is a pre-release.
#
#     git tag -a v1.0.0 -m "Curvis 1.0.0" && git push origin v1.0.0

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installers:
    name: installers
    uses: ./.github/workflows/installers.yml

  validation:
    name: validation report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Fails the release if any analysis no longer matches R.
      - name: Write the validation report
        run: |
          mkdir -p dist
          uv run python scripts/validation_report.py \
            --markdown dist/curvis-validation-report.md --pdf dist/curvis-validation-report.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: curvis-validation-report
          path: dist/curvis-validation-report.*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [installers, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload the installers
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: curvis-*
          path: dist
          merge-multiple: true

      - name: List the installers
        run: ls -l dist

      - name: Write the release notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md && cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Curvis ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
