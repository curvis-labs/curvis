[project]
name = "curvis"
version = "0.1.0"
description = "Desktop app for scientific data analysis and plotting."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pyside6>=6.8",
]

[project.scripts]
curvis = "curvis.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3,<9.2",  # pytest-benchmark 5.3 breaks on pytest 9.2 (uses node._nodeid)
    "pytest-benchmark>=5.1",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curvis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["curvis"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "curvis.core.*",
    "curvis.formula.*",
    "curvis.analysis.*",
    "curvis.io.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--benchmark-skip"]
qt_api = "pyside6"
